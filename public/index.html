<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Circle Clicker: click the moving circle as many times as you can in 30 seconds and compete on the scoreboard.">
    <title>Circle Clicker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="js/main.js" defer></script>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  </head>
  <body>
    <!-- Logged-in user + logout, shown on every screen -->
    <nav class="navbar bg-white border-bottom px-3 d-flex justify-content-between align-items-center">
      <span id="whoami" class="navbar-text text-dark"></span>
      <button id="logout" type="button" class="btn btn-secondary btn-sm">Logout</button>
    </nav>

    <main>
    <!-- Screen 1: home menu -->
    <div id="home" class="d-flex flex-column align-items-center justify-content-center gap-3 min-vh-100">
      <h1 class="mb-3">Circle Clicker</h1>
      <button id="start" class="btn btn-success btn-lg" style="min-width: 220px;">Start game</button>
      <button id="view" class="btn btn-outline-primary btn-lg" style="min-width: 220px;">View scoreboard</button>
    </div>

    <!-- Screen 2: the game - a top bar, then the play area with the circle -->
    <div id="game" hidden>
      <nav id="gameBar" class="navbar bg-white border-bottom px-3 d-flex justify-content-between align-items-center">
        <span class="navbar-text text-dark">Time left: <span id="time">30</span> | Hits: <span id="hits">0</span></span>
        <button id="endGame" type="button" class="btn btn-danger btn-sm">End game</button>
      </nav>
      <div id="play">
        <button id="target"></button>
      </div>
    </div>

    <!-- Screen 3: enter a name for the score just earned -->
    <div id="nameEntry" hidden class="d-flex flex-column align-items-center justify-content-center min-vh-100">
      <div class="card shadow-sm p-4" style="width: 100%; max-width: 380px;">
        <p class="text-center mb-3">Your score: <span id="finalHits">0</span> hits</p>
        <form id="scoreForm">
          <div class="mb-3">
            <label for="name" class="form-label">Enter your name:</label>
            <input id="name" class="form-control" placeholder="Name" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Save</button>
        </form>
        <button id="skip" type="button" class="btn btn-outline-secondary w-100 mt-2">Don't Save</button>
      </div>
    </div>

    <!-- Screen 4: results table, rows filled in by drawScores() in main.js -->
    <div id="scoreboard" hidden class="container py-4">
      <table class="table table-striped table-bordered">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Name</th>
            <th>Hits</th>
            <th>Hits/sec</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="scoreRows"></tbody>
      </table>
      <button id="back" class="btn btn-secondary">Home</button>
    </div>
    </main>
  </body>
</html>
