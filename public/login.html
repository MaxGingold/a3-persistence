<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Log in or sign up to play Circle Clicker, a reaction-speed clicking game with a persistent scoreboard.">
    <title>Log in - Circle Clicker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="js/login.js" defer></script>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  </head>
  <body class="bg-light">
    <main class="container d-flex flex-column align-items-center justify-content-center min-vh-100">
      <h1 class="mb-4 text-center">Circle Clicker</h1>

      <div class="card shadow-sm p-4 border-dark" style="width: 100%; max-width: 380px;">
        <p class="text-muted small text-center mb-3">Log in with any username/password. If the account doesn't exist yet, it will be created for you.</p>

        <form id="loginForm">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input id="username" name="username" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input id="password" name="password" type="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Log in / Sign up</button>
        </form>

        <p id="loginError" class="text-danger small mt-3 mb-0" hidden></p>

        <hr class="opacity-100">

        <a id="githubLogin" href="/auth/github" class="btn btn-dark w-100">Log in with GitHub</a>
      </div>
    </main>
  </body>
</html>
